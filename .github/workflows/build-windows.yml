name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name ARK-Cheat-Detector src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ARK-Cheat-Detector-Windows
          path: dist/ARK-Cheat-Detector.exe
